[project]
name = "ironcad-mcp"
version = "0.1.0"
description = "Local MCP server wrapping IronCAD 2024's COM API (python-ironcad / ICAPI) so Claude can build from a sketch using the user's own catalog."
readme = "README.md"
requires-python = ">=3.11"

# Pins are deliberate. See README + API_NOTES.md for the reasoning:
#  * mcp<2  -> mcp 2.x renamed FastMCP to MCPServer; the spec's code targets FastMCP.
#  * python-ironcad brings comtypes==1.4.16 (its real COM layer, not pywin32).
#  * pywin32 supplies pythoncom for STA CoInitialize on the worker thread.
dependencies = [
    "mcp>=1.30,<2",
    "python-ironcad==0.1.21",
    "pywin32==312",
    "comtypes==1.4.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ironcad-mcp = "ironcad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ironcad_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
